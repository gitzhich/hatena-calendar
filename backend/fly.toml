# Fly.io の設定（docs/architecture.md 第 8 章 / docs/runbook-deploy.md）。
#
# **シークレットをここに書かない。** `fly secrets set` で入れる。
# fly.toml はリポジトリに入るため、書けばそのままコミットされる
# （docs/security.md T-01）。
#
# app 名は Fly.io 全体で一意。取られていたら変える。

app = "hatenacal"
primary_region = "nrt"

[build]

[env]
  # application.yml の ${PORT:8080} と internal_port に合わせる
  PORT = "8080"
  # コンテナのメモリ上限からヒープを決める。JVM は cgroup の上限を見るが、
  # 既定の 25% だと 512MB のマシンで 128MB しか使わず GC が回り続ける
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=70"

[http_service]
  internal_port = 8080
  force_https = true

  # **止めない。** auto_stop で寝かせると @Scheduled の取り込みが動かなくなる
  # （CLAUDE.md「Fly.io は常時起動」）。
  auto_stop_machines = false
  auto_start_machines = false

  # **1 台に固定する。** 複数台だと取り込みが多重起動し、
  # 同じ範囲を並行して取得して X API の課金が倍になる。
  min_machines_running = 1

  [[http_service.checks]]
    path = "/actuator/health"
    method = "GET"
    # 起動には Flyway の適用が入る。短すぎると起動途中で不健全と判定される
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"

[deploy]
  # 1 台構成なので、入れ替えは停止 → 起動になる（数十秒の断）。
  # 2 台を同時に走らせる方式にしない。取り込みの多重起動を避けるため。
  # なお重なっても ingestion_run の RUNNING 行で弾かれる
  # （docs/x-integration.md 第 10.1 節）が、構成側でも起こさない。
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  # JVM に 256MB は狭い。512MB で常時起動して月 $3 前後
  # （docs/architecture.md 第 11 章の $2〜5 に収まる）
  memory = "512mb"
  cpus = 1
