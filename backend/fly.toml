# Fly.io の設定（docs/architecture.md 第 8 章 / docs/runbook-deploy.md）。
#
# **シークレットをここに書かない。** `fly secrets set` で入れる。
# fly.toml はリポジトリに入るため、書けばそのままコミットされる
# （docs/security.md T-01）。
#
# app 名は Fly.io 全体で一意。取られていたら変える。

app = "hatenacal"
# **Neon と同じ Singapore に置く。** Neon に東京リージョンが無いため
# （ADR-0018）、どこかで太平洋を跨ぐことは避けられない。バックエンドと DB を
# 同居させると、跨ぐのが「クエリごと」ではなく「リクエストごと 1 回」になる。
# 管理画面と取り込みジョブは 1 リクエストで複数回クエリを打つため、ここが効く。
primary_region = "sin"

[build]

[env]
  # application.yml の ${PORT:8080} と internal_port に合わせる
  PORT = "8080"
  # コンテナのメモリ上限からヒープを決める。JVM は cgroup の上限を見るが、
  # 既定の 25% だと 512MB のマシンで 128MB しか使わず GC が回り続ける
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=70"

[http_service]
  internal_port = 8080
  force_https = true

  # **止めない。** auto_stop で寝かせると @Scheduled の取り込みが動かなくなる
  # （CLAUDE.md「Fly.io は常時起動」）。
  auto_stop_machines = false
  auto_start_machines = false

  # **0 のままにする。** この値は auto_stop_machines が "stop" / "suspend" の
  # ときだけ意味を持つ。こちらは false なので効かない。
  #
  # それどころか 1 以上にすると `fly deploy` が HA 用の予備機をもう 1 台作り、
  # **取り込みが二重に走る**。初回デプロイで実際に 2 台立ち、両方が
  # スケジューラを実行した（source_account が空だったため課金は出なかった）。
  #
  # **台数を 1 に保つのは fly.toml ではなく `fly deploy --ha=false`。**
  # fly.toml に予備機を止める設定は無い。デプロイ後に `fly status` で
  # 1 台であることを必ず確かめる（docs/runbook-deploy.md 第 3.4 節）。
  min_machines_running = 0

  [[http_service.checks]]
    path = "/actuator/health"
    method = "GET"
    # 起動には Flyway の適用が入る。短すぎると起動途中で不健全と判定される
    grace_period = "40s"
    interval = "30s"
    timeout = "5s"

[deploy]
  # 1 台構成なので、入れ替えは停止 → 起動になる（数十秒の断）。
  # 2 台を同時に走らせる方式にしない。取り込みの多重起動を避けるため。
  # なお重なっても ingestion_run の RUNNING 行で弾かれる
  # （docs/x-integration.md 第 10.1 節）が、構成側でも起こさない。
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  # JVM に 256MB は狭い。512MB で常時起動して月 $3 前後
  # （docs/architecture.md 第 11 章の $2〜5 に収まる）
  memory = "512mb"
  cpus = 1
